version: '3'

services:
    postgres:
        container_name: beets-backend
        image: postgres:14-alpine
        ports:
            - '5431:5432'
        environment:
            POSTGRES_USER: backend
            POSTGRES_PASSWORD: let-me-in
            POSTGRES_DB: database
        volumes:
            - data:/var/lib/postgresql/data
        networks:
            - beets

networks:
    beets:
        name: beets

volumes:
    data:
